name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project configuration
        run: node -e "const p=require('./package.json'); if(!p.version || !p.build || !p.build.publish) process.exit(1); console.log('Package',p.name,p.version)"

      - name: Create version tag for GitHub release
        shell: pwsh
        run: |
          $tag = "v$(node -p "require('./package.json').version")"
          git fetch --tags origin
          if (-not (git tag --list $tag)) {
            git tag $tag
          }
          git push origin $tag

      - name: Build and publish Windows installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
